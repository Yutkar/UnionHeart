<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Simple Racing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="simple-racing.css">
</head>
<body>

<div class="game-wrapper">

  <!-- Горизонт (фон) — не обязателен, но красиво -->
  <div id="sky"></div>
  <div id="terrain"></div>

  <!-- Горы -->
  <div id="mountains"></div>

  <!-- Дорога (canvas) -->
  <canvas id="road"></canvas>

  <!-- Противники -->
  <div id="cars"></div>

  <!-- Машина игрока -->
  <div id="car"></div>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-block">
      <div>KM</div>
      <div id="km" class="digits">
        <span>0</span><span>0</span><span>0</span><span>0</span>
      </div>
    </div>
    <div class="hud-block">
      <div>POSITION</div>
      <div id="position" class="digits">
        <span>2</span><span>0</span><span>0</span>
      </div>
    </div>
    <div class="hud-block">
      <div>LAP</div>
      <div id="lap">1</div>
    </div>
  </div>

  <!-- Туман -->
  <div id="fog" class="hidden"></div>

  <!-- Сообщение game over -->
  <div id="gameOverMessage" class="hidden">CRASH!</div>

  <!-- Мобильные кнопки -->
  <div class="touch-controls">
    <button id="left">◀</button>
    <button id="up">▲</button>
    <button id="right">▶</button>
  </div>

</div>

<!-- Панель управления -->
<div class="controls">
  <button onclick="startGame()">Старт</button>
  <button onclick="pauseGame()">Пауза</button>
  <button onclick="restartGame()">Рестарт</button>
</div>

<script type="module" src="Games/Racing/SimpleRacing.js"></script>
</body>
</html>

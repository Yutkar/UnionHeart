<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Simple Racing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="simple-racing.css">
</head>
<body>

<div class="game-wrapper">

  <div class="hud">
    <div class="hud-block">
      <label>KM</label>
      <div id="km" class="digits">
        <span>0</span><span>0</span><span>0</span><span>0</span>
      </div>
    </div>

    <div class="hud-block">
      <label>Position</label>
      <div id="position" class="digits">
        <span>2</span><span>0</span><span>0</span>
      </div>
    </div>

    <div class="hud-block">
      <label>Lap</label>
      <div id="lap">1</div>
    </div>
  </div>

  <!-- дорога -->
  <canvas id="road"></canvas>

  <!-- машины соперников -->
  <div id="cars"></div>

  <!-- машина игрока -->
  <div id="car"></div>

  <!-- горы -->
  <div id="mountains"></div>

  <!-- туман (управляется скриптом) -->
  <input id="fog" type="range" min="0.01" max="0.2" step="0.01" class="hidden">

  <p id="gameOverMessage" class="game-over" style="display:none;"></p>

  <div class="controls">
    <button id="startBtn">Старт</button>
    <button id="pauseBtn">Пауза</button>
    <button id="restartBtn">Перезапуск</button>
  </div>

  <!-- кнопки управления -->
  <div class="touch-controls">
    <button id="left">◀</button>
    <button id="up">▲</button>
    <button id="right">▶</button>
  </div>

</div>

<script src="gameControls.js"></script>
<script type="module" src="Games/Racing/SimpleRacing.js"></script>

</body>
</html>

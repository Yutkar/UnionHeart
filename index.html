<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Union Heart</title>
  <!-- Основные мета-теги -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Union Heart — сайт с играми, созданными вручную на JavaScript. Здесь собраны игры, которые объединяют.">
<meta name="keywords" content="игры, union heart, браузерные игры, javaScript, развлечения, онлайн игры">
<meta name="author" content="Union Heart Team">

<!-- Соцсети и предпросмотр -->
<meta property="og:title" content="Union Heart — Игры, которые объединяют">
<meta property="og:description" content="Бесплатные игры, созданные вручную на JavaScript. Без скачиваний и рекламы.">
<meta property="og:image" content="https://yutkar.github.io/UnionHeart/images/logo.png">
<meta property="og:url" content="https://yutkar.github.io/UnionHeart/index.html">
<meta name="twitter:card" content="summary_large_image">

  <link rel="apple-touch-icon" href="images/favicon.png">
  <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style1.css">
</head>
<body>
  <!-- Шапка -->
  <header>
    <div class="logo">
      <span class="icon">❤</span> UNION HEART
    </div>
    <nav>
	    <a href="index.html" class="active">Главная</a>
	    <a href="Katalog.html">Каталог</a>
      <a href="oProecte.html">О проекте</a>
    </nav>
    <div id="user-panel">
      <span id="userInfo"></span>
      <button id="loginBtn">Войти через Google</button>
      <button id="logoutBtn" style="display:none;">Выйти</button>
      <span id="authMessage"></span>
    </div>
  </header>

  <!-- Основной блок сайта -->
  <main>
    <div class="content-box">
      
      <!-- Hero-блок -->
      <section class="hero">
        <h1><span class="icon">❤️</span> UNION HEART</h1>
        <p>Игры, которые объединяют</p>
        <button id="openCatalog" class="main-btn" aria-label="Случайная игра">ВЫБЕРИ ИГРУ</button>
      </section>

	<section class="random-game">
		<button id="randomGameBtn" class="random-btn"></button>
	</section>

    </div>
  </main>



  <div class="leaderboard-controls">
  <label for="gameSelect">Выбери игру:</label>
  <select id="gameSelect">
    <option value="snake">🐍 Змейка</option>
    <option value="flappy">🐤 Flappy</option>
    <option value="tetris">🧱 Тетрис</option>
  </select>
</div>
 <table id="leaderboardTable" border="1">
  <thead>
    <tr>
      <th>№</th>
      <th>Игрок</th>
      <th>Рейтинг</th>
    </tr>
  </thead>
  <tbody id="leaderboardBody">
    <!-- строки подставятся через JS -->
  </tbody>
</table>

</table>





  <!-- Подвал -->
  <footer>
    <div class="footer-links">
      <a href="oProecte.html">О проекте</a>
      <a href="#">Соцсети</a>
    </div>
    <p>© 2025 Union Heart – Игры с душой</p>
  </footer>

  <script src="script1.js"></script>
  <script type="module" src="firebase-init.js"></script>
  <script type="module" src="auth.js"></script>
  <script type="module" src="scores.js"></script>
  <script type="module" src="leaderboard.js"></script>
</body>
</html>
